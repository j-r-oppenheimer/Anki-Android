# 저장할 위치: .github/workflows/apply-and-build.yml
#
# Actions 탭 -> "Apply patches and build" -> Run workflow 를 누르면
#   1. 새 파일 24개를 저장소에 생성하고
#   2. 기존 파일 여러 군데를 수정한 뒤
#   3. 변경사항을 브랜치에 커밋하고
#   4. 릴리즈 APK를 빌드해서 Releases에 올립니다.
#
# 패치 앵커가 하나라도 안 맞으면 빌드 전에 명확한 에러를 내고 멈춥니다.
# 이미 적용된 상태에서 다시 돌리면 건너뛰고 빌드만 합니다.

name: Apply patches and build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply all patches
        run: python3 apply_patches.py
        shell: bash

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Heatmap widget, soft themes, image save, split-screen, custom font, fixes"
            git push
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # AnkiDroid는 코틀린 경고를 전부 에러로 올려둡니다(build.gradle.kts 의
      # allWarningsAsErrors = fatalWarnings). 사소한 경고 하나로 20분짜리 빌드가
      # 날아가지 않도록 이 커스텀 빌드에서는 끕니다. 이 값은 allWarningsAsErrors
      # 한 곳에만 쓰이므로 다른 동작에는 영향이 없습니다.
      # sdk.dir 은 러너의 ANDROID_HOME 이 대신 쓰이므로 적지 않아도 됩니다.
      - name: Relax Kotlin warnings-as-errors
        run: echo "fatal_warnings=false" >> local.properties

      # 릴리즈 빌드입니다. AnkiDroid 저장소에 포함된 폴백 키스토어로 서명되므로
      # 별도 서명 키 설정이 필요 없습니다.
      # customSuffix 로 패키지명이 com.ichi2.anki.custom 이 되어
      # 공식 AnkiDroid와 나란히 설치됩니다.
      # 문제가 생기면 아래 줄을 assembleFullDebug 로 바꾸고 -Pcustom* 옵션을 지우세요.
      - name: Build release APK
        run: |
          ./gradlew :AnkiDroid:assembleFullRelease \
            -PabiFilter=arm64-v8a \
            -PcustomSuffix=".custom" \
            -PcustomName="Anki" \
            --no-daemon --stacktrace

      # 빌드가 깨졌을 때 lint 전체 목록을 로그에 남깁니다.
      # 실패 로그는 스택 트레이스가 길어서 정작 원인 줄이 잘리기 쉽습니다.
      - name: Print lint report on failure
        if: failure()
        run: |
          for f in AnkiDroid/build/intermediates/lint_vital_intermediate_text_report/*/*/lint-results-*.txt; do
            echo "===== $f ====="
            cat "$f"
          done
        shell: bash

      - name: Collect APKs
        run: |
          mkdir -p out
          find AnkiDroid/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: heatmap-${{ github.run_number }}
          name: Anki custom build ${{ github.run_number }}
          body: |
            릴리즈 빌드 (R8 최적화, 서명됨).
            패키지명 com.ichi2.anki.custom — 공식 AnkiDroid와 나란히 설치됩니다.
          files: out/*.apk
