<!--
  저장할 위치: AnkiDroid/src/main/assets/heatmap_picker.html
  WebView가 file:///android_asset/heatmap_picker.html 로 읽습니다.

  색 선택은 이 페이지 안에서 직접 합니다 (HSV 사각형 + 색상 띠 + 16진수 입력).
  브라우저/OS 기본 색상 대화상자는 쓰지 않습니다.

  곡선 그래프
    가로축 = 색 (연함 -> 진함)
    세로축 = 하루 복습 수
    오른쪽 끝 손잡이를 위아래로 끌면 "색이 가장 진해지는 개수"가 정해집니다.
    가운데 손잡이를 끌면 곡선이 휩니다.

  색 계산은 HeatmapWidget.kt 와 같은 식입니다 (OkLab 보간, 강도 = 개수비^gamma).
-->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  /* 값은 전부 Kotlin이 현재 AnkiDroid 테마에서 읽어 넣습니다.
     아래는 테마를 못 읽었을 때만 쓰이는 대체값입니다. */
  :root {
    --bg: #0e0f12;
    --surface: #181a1f;
    --surface-2: #21242a;
    --line: #2c3037;
    --text: #eceef2;
    --muted: #91969f;
    --accent: #39d353;
    --on-accent: #ffffff;
    --stage-1: #55606f;
    --stage-2: #333a46;
    --stage-3: #23272f;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; background: var(--bg); }

  body {
    font-family: system-ui, -apple-system, "Roboto", sans-serif;
    color: var(--text);
    padding: 0 16px calc(96px + env(safe-area-inset-bottom));
    -webkit-user-select: none;
    user-select: none;
  }

  header { padding: 22px 2px 16px; }
  header h1 { margin: 0; font-size: 21px; font-weight: 650; letter-spacing: -0.01em; }
  header p { margin: 5px 0 0; font-size: 13px; color: var(--muted); }

  /* ---------------------------------------------------------- 미리보기 */
  .stage {
    border-radius: 20px;
    padding: 16px;
    background: radial-gradient(120% 100% at 15% 0%, var(--stage-1) 0%, var(--stage-2) 45%, var(--stage-3) 100%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
  }
  #preview { display: block; width: 100%; }

  /* ---------------------------------------------------------- 섹션 */
  section { margin-top: 26px; }
  .label {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 0 2px 10px;
  }
  .label h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .label .hint { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .card { background: var(--surface); border-radius: 18px; padding: 16px; }

  /* ---------------------------------------------------------- 색 고르기 */
  .targets { display: flex; gap: 8px; margin-bottom: 14px; }
  .targets button {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-width: 0;
    height: 40px;
    padding: 0 6px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
  }
  .targets button[aria-pressed="true"] {
    border-color: var(--text);
    color: var(--text);
    background: var(--surface-2);
  }
  .targets .dot {
    width: 15px;
    height: 15px;
    flex: none;
    border-radius: 999px;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
  }

  #sv, #hue { display: block; width: 100%; touch-action: none; }
  #hue { margin-top: 12px; }

  .hexrow { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .hexrow input {
    width: 118px;
    flex: none;
    height: 40px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface-2);
    color: var(--text);
    font-family: ui-monospace, monospace;
    font-size: 15px;
    letter-spacing: 0.06em;
    -webkit-user-select: text;
    user-select: text;
  }
  .hexrow span { font-size: 12px; color: var(--muted); }

  .rowcap {
    display: block;
    margin: 16px 2px 8px;
    font-size: 11px;
    letter-spacing: 0.03em;
    color: var(--muted);
  }

  .presets {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 8px;
  }
  .presets button {
    aspect-ratio: 1;
    min-height: 30px;
    border: none;
    padding: 0;
    border-radius: 999px;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16);
  }

  /* ---------------------------------------------------------- 곡선 */
  #curve { display: block; width: 100%; touch-action: none; }
  .curve-note { margin: 14px 2px 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .curve-note b { color: var(--text); font-weight: 600; }

  .chips { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .chips button {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 999px;
  }
  .chips button:disabled { color: #5b606a; border-color: #23262c; }

  /* ---------------------------------------------------------- 슬라이더 */
  .row { display: flex; align-items: center; gap: 14px; padding: 6px 0; }
  .row label { width: 78px; flex: none; font-size: 14px; }
  .row .val {
    width: 60px;
    flex: none;
    text-align: right;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  input[type=range] {
    flex: 1;
    min-width: 0;
    height: 28px;
    accent-color: var(--accent);
    background: transparent;
  }

  /* ---------------------------------------------------------- 하단 */
  footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    gap: 10px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 62%, rgba(14, 15, 18, 0));
  }
  footer button {
    height: 50px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
  }
  #cancel { flex: none; width: 96px; background: var(--surface-2); color: var(--text); }
  #save { flex: 1; background: var(--accent); color: var(--on-accent); }
</style>
</head>
<body>

<header>
  <h1 data-i18n="title"></h1>
  <p data-i18n="subtitle"></p>
</header>

<div class="stage">
  <canvas id="preview"></canvas>
</div>

<section>
  <div class="label"><h2 data-i18n="section_color"></h2><span class="hint" id="targetHint"></span></div>
  <div class="card">
    <div class="targets" id="targets"></div>
    <canvas id="sv"></canvas>
    <canvas id="hue"></canvas>
    <div class="hexrow">
      <input type="text" id="hex" maxlength="7" spellcheck="false" autocapitalize="characters"
             inputmode="text" data-i18n-aria="hex_label">
      <span data-i18n="hex_hint"></span>
    </div>
    <div id="themeRow" hidden>
      <span class="rowcap" data-i18n="wallpaper_colors"></span>
      <div class="presets" id="themeColors"></div>
    </div>
    <span class="rowcap" data-i18n="basic_colors"></span>
    <div class="presets" id="presets"></div>
  </div>
</section>

<section>
  <div class="label"><h2 data-i18n="section_curve"></h2><span class="hint" id="peakHint"></span></div>
  <div class="card">
    <canvas id="curve"></canvas>
    <p class="curve-note" id="curveNote"></p>
    <div class="chips">
      <button id="straight" data-i18n="straight"></button>
      <button id="autoMax" data-i18n="auto_max"></button>
    </div>
  </div>
</section>

<section>
  <div class="label"><h2 data-i18n="section_shape"></h2></div>
  <div class="card">
    <div class="row">
      <label data-i18n="corner"></label>
      <input type="range" id="corner" min="0" max="50" step="1">
      <span class="val" id="cornerOut"></span>
    </div>
    <div class="row">
      <label data-i18n="gap"></label>
      <input type="range" id="gap" min="0" max="35" step="1">
      <span class="val" id="gapOut"></span>
    </div>
    <div class="row">
      <label data-i18n="opacity"></label>
      <input type="range" id="alpha" min="1" max="254" step="1">
      <span class="val" id="alphaOut"></span>
    </div>
  </div>
</section>

<footer>
  <button id="cancel" data-i18n="cancel"></button>
  <button id="save" data-i18n="save"></button>
</footer>

<script>
"use strict";

var DEFAULTS = {
  base: "#2F81F7",
  empty: "#2A2C31",
  background: "#000000",
  alpha: 102,
  corner: 25,
  gap: 18,
  curveX: 50,
  curveY: 50,
  maxCount: 0
};

var PRESETS = [
  "#2F81F7", "#58A6FF", "#4FC3E8", "#39D353", "#3FB950",
  "#A371F7", "#DB61A2", "#F0883E", "#E3B341"
];

/** 배경화면에서 뽑아낸 시스템 색. 안드로이드 12 이상에서만 채워집니다. */
var THEME_COLORS = [];

var TARGETS = [
  { key: "base", label: "target_base", hint: "target_base_hint" },
  { key: "empty", label: "target_empty", hint: "target_empty_hint" },
  { key: "background", label: "target_background", hint: "target_background_hint" }
];

var INTENSITY_FLOOR = 0.18;
var ROWS = 7;
var PREVIEW_COLUMNS = 17;
var PLOT = { left: 40, right: 26, top: 16, bottom: 30 };

var S = Object.assign({}, DEFAULTS);
var STATS = { counts: [], auto: 40, peak: 0, weekday: 0, ready: false };
var active = "base";
var HSV = { h: 140, s: 0.7, v: 0.8 };
var axisTop = 100;

function el(id) { return document.getElementById(id); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function boxWidth(canvas) { return canvas.parentNode.clientWidth - 32; }

/* ------------------------------------------------------------------ 색 변환 */

function parseHex(hex) {
  return [
    parseInt(hex.slice(1, 3), 16),
    parseInt(hex.slice(3, 5), 16),
    parseInt(hex.slice(5, 7), 16)
  ];
}

function toHex(rgb) {
  return "#" + rgb.map(function (v) {
    return ("0" + clamp(Math.round(v), 0, 255).toString(16)).slice(-2).toUpperCase();
  }).join("");
}

function hsvToRgb(h, s, v) {
  var c = v * s;
  var hp = (h % 360) / 60;
  var x = c * (1 - Math.abs((hp % 2) - 1));
  var m = v - c;
  var r = [[c, x, 0], [x, c, 0], [0, c, x], [0, x, c], [x, 0, c], [c, 0, x]][Math.floor(hp) % 6];
  return [(r[0] + m) * 255, (r[1] + m) * 255, (r[2] + m) * 255];
}

function rgbToHsv(rgb) {
  var r = rgb[0] / 255, g = rgb[1] / 255, b = rgb[2] / 255;
  var max = Math.max(r, g, b), min = Math.min(r, g, b);
  var d = max - min;
  var h = 0;
  if (d > 0) {
    if (max === r) { h = 60 * (((g - b) / d) % 6); }
    else if (max === g) { h = 60 * ((b - r) / d + 2); }
    else { h = 60 * ((r - g) / d + 4); }
  }
  if (h < 0) { h += 360; }
  return { h: h, s: max === 0 ? 0 : d / max, v: max };
}

function hsvCss(h, s, v) {
  var rgb = hsvToRgb(h, s, v);
  return "rgb(" + Math.round(rgb[0]) + "," + Math.round(rgb[1]) + "," + Math.round(rgb[2]) + ")";
}

/* ------------------------------------------------------------------ OkLab */

function srgbToLinear(c) {
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}

function linearToSrgb(c) {
  return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
}

function toOklab(hex) {
  var rgb = parseHex(hex);
  var r = srgbToLinear(rgb[0] / 255);
  var g = srgbToLinear(rgb[1] / 255);
  var b = srgbToLinear(rgb[2] / 255);

  var l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  var m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  var s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);

  return [
    0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
    1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
    0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s
  ];
}

function fromOklab(lab) {
  var lp = lab[0] + 0.3963377774 * lab[1] + 0.2158037573 * lab[2];
  var mp = lab[0] - 0.1055613458 * lab[1] - 0.0638541728 * lab[2];
  var sp = lab[0] - 0.0894841775 * lab[1] - 1.2914855480 * lab[2];

  var l = lp * lp * lp;
  var m = mp * mp * mp;
  var s = sp * sp * sp;

  return "rgb(" +
    channel(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s) + "," +
    channel(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s) + "," +
    channel(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s) + ")";
}

function channel(linear) {
  return clamp(Math.round(linearToSrgb(linear) * 255), 0, 255);
}

function mixOklab(fromHex, toHex_, amount) {
  var t = clamp(amount, 0, 1);
  var a = toOklab(fromHex);
  var b = toOklab(toHex_);
  return fromOklab([
    a[0] + (b[0] - a[0]) * t,
    a[1] + (b[1] - a[1]) * t,
    a[2] + (b[2] - a[2]) * t
  ]);
}

/* ------------------------------------------------------------------ 색 계산 */

function effectiveMax() {
  return S.maxCount > 0 ? S.maxCount : STATS.auto;
}

/* 곡선 손잡이 (색 = curveX%, 개수 = 최대 개수의 curveY%) 를 지나는 지수 */
function gamma() {
  var color = clamp(S.curveX, 4, 96) / 100;
  var count = clamp(S.curveY, 4, 96) / 100;
  if (Math.abs(color - count) < 1e-4) { return 1; }
  return clamp(Math.log(color) / Math.log(count), 0.15, 6);
}

function intensityAt(countRatio) {
  return Math.pow(clamp(countRatio, 0, 1), gamma());
}

/* 색 강도로부터 개수비를 되돌립니다. 곡선을 그릴 때 씁니다. */
function countRatioAt(intensity) {
  return Math.pow(clamp(intensity, 0, 1), 1 / gamma());
}

function colorForIntensity(intensity) {
  return mixOklab(S.empty, S.base, INTENSITY_FLOOR + (1 - INTENSITY_FLOOR) * intensity);
}

function colorForCount(count) {
  if (count <= 0) { return S.empty; }
  return colorForIntensity(intensityAt(count / Math.max(1, effectiveMax())));
}

/* ------------------------------------------------------------------ 캔버스 */

function setupCanvas(canvas, cssWidth, cssHeight) {
  var dpr = window.devicePixelRatio || 1;
  canvas.style.height = cssHeight + "px";
  canvas.width = Math.max(1, Math.round(cssWidth * dpr));
  canvas.height = Math.max(1, Math.round(cssHeight * dpr));
  var ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssWidth, cssHeight);
  return { ctx: ctx, w: cssWidth, h: cssHeight };
}

function rrPath(ctx, x, y, w, h, r) {
  var radius = clamp(r, 0, Math.min(w, h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.arcTo(x + w, y, x + w, y + h, radius);
  ctx.arcTo(x + w, y + h, x, y + h, radius);
  ctx.arcTo(x, y + h, x, y, radius);
  ctx.arcTo(x, y, x + w, y, radius);
  ctx.closePath();
}

function knob(ctx, x, y, fill, radius) {
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.beginPath();
  ctx.arc(x, y, radius + 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.stroke();
}

/* ------------------------------------------------------------------ 색 위젯 */

function drawSV() {
  var canvas = el("sv");
  var width = boxWidth(canvas);
  if (width <= 0) { return; }
  var view = setupCanvas(canvas, width, 158);
  var ctx = view.ctx;

  ctx.save();
  rrPath(ctx, 0, 0, view.w, view.h, 14);
  ctx.clip();

  var saturation = ctx.createLinearGradient(0, 0, view.w, 0);
  saturation.addColorStop(0, "#ffffff");
  saturation.addColorStop(1, hsvCss(HSV.h, 1, 1));
  ctx.fillStyle = saturation;
  ctx.fillRect(0, 0, view.w, view.h);

  var value = ctx.createLinearGradient(0, 0, 0, view.h);
  value.addColorStop(0, "rgba(0,0,0,0)");
  value.addColorStop(1, "#000000");
  ctx.fillStyle = value;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.restore();

  knob(ctx, HSV.s * view.w, (1 - HSV.v) * view.h, S[active], 9);
}

function drawHue() {
  var canvas = el("hue");
  var width = boxWidth(canvas);
  if (width <= 0) { return; }
  var view = setupCanvas(canvas, width, 30);
  var ctx = view.ctx;

  ctx.save();
  rrPath(ctx, 0, 4, view.w, view.h - 8, (view.h - 8) / 2);
  ctx.clip();
  var strip = ctx.createLinearGradient(0, 0, view.w, 0);
  for (var stop = 0; stop <= 6; stop++) {
    strip.addColorStop(stop / 6, hsvCss(stop * 60, 1, 1));
  }
  ctx.fillStyle = strip;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.restore();

  knob(ctx, (HSV.h / 360) * view.w, view.h / 2, hsvCss(HSV.h, 1, 1), 8);
}

function commitHsv() {
  S[active] = toHex(hsvToRgb(HSV.h, HSV.s, HSV.v));
  redraw();
}

/* ------------------------------------------------------------------ 미리보기 */

function previewCounts() {
  var total = (PREVIEW_COLUMNS - 1) * ROWS + STATS.weekday + 1;
  if (STATS.counts.length >= total) {
    return STATS.counts.slice(STATS.counts.length - total);
  }
  var out = [];
  var seed = 7;
  for (var i = 0; i < total; i++) {
    seed = (seed * 1103515245 + 12345) % 2147483648;
    var r = seed / 2147483648;
    out.push(r < 0.22 ? 0 : Math.round(r * r * effectiveMax() * 1.3));
  }
  return out;
}

function drawPreview() {
  var canvas = el("preview");
  var width = boxWidth(canvas);
  if (width <= 0) { return; }
  var pitch = width / PREVIEW_COLUMNS;
  var view = setupCanvas(canvas, width, Math.round(pitch * ROWS));
  var ctx = view.ctx;

  var bg = parseHex(S.background);
  ctx.fillStyle = "rgba(" + bg[0] + "," + bg[1] + "," + bg[2] + "," +
    (S.alpha / 255).toFixed(3) + ")";
  rrPath(ctx, 0, 0, view.w, view.h, 14);
  ctx.fill();

  var gap = pitch * (S.gap / 100);
  var cell = pitch - gap;
  var radius = cell * (S.corner / 100);
  var counts = previewCounts();

  for (var i = 0; i < counts.length; i++) {
    var column = Math.floor(i / ROWS);
    if (column >= PREVIEW_COLUMNS) { continue; }
    ctx.fillStyle = colorForCount(counts[i]);
    rrPath(ctx, column * pitch + gap / 2, (i % ROWS) * pitch + gap / 2, cell, cell, radius);
    ctx.fill();
  }
}

/* ------------------------------------------------------------------ 곡선 */

function plotRect(view) {
  return {
    x: PLOT.left,
    y: PLOT.top,
    w: view.w - PLOT.left - PLOT.right,
    h: view.h - PLOT.top - PLOT.bottom
  };
}

/**
 * 세로축 위쪽 끝.
 *
 * 최고 기록에 맞추면 어쩌다 몰아친 하루 때문에 곡선이 바닥에 눌려버립니다.
 * 그래서 자동값(90 백분위수)의 두 배를 기준으로 잡아 기본 상태에서 최대 개수
 * 손잡이가 그래프 중간 높이에 오게 합니다. 최고 기록은 옆의 안내 문구에 적습니다.
 *
 * 끌고 있는 동안 축이 늘어나면 손잡이가 손가락을 피해 달아나므로,
 * 이 함수는 기록이 도착할 때와 화면을 처음 열 때만 부릅니다.
 */
function recomputeAxisTop() {
  if (!STATS.ready) {
    axisTop = 100;
    return;
  }
  var wanted = Math.max(STATS.auto * 2, S.maxCount * 1.2, 20);
  var step = wanted > 300 ? 50 : (wanted > 100 ? 20 : 10);
  axisTop = Math.ceil(wanted / step) * step;
}

function countStep() {
  return axisTop > 200 ? 5 : 1;
}

function drawCurve() {
  var canvas = el("curve");
  var width = boxWidth(canvas);
  if (width <= 0) { return; }
  var view = setupCanvas(canvas, width, 250);
  var ctx = view.ctx;
  var p = plotRect(view);
  var max = effectiveMax();

  /* 배경: 가로축이 곧 색 견본입니다 */
  ctx.save();
  rrPath(ctx, p.x, p.y, p.w, p.h, 12);
  ctx.clip();
  var slices = 72;
  for (var s = 0; s < slices; s++) {
    ctx.fillStyle = colorForIntensity((s + 0.5) / slices);
    ctx.fillRect(p.x + (p.w * s) / slices, p.y, p.w / slices + 0.6, p.h);
  }
  /* 세로축 안내선 */
  ctx.strokeStyle = "rgba(0,0,0,0.22)";
  ctx.lineWidth = 1;
  for (var g = 1; g < 4; g++) {
    var gy = p.y + (p.h * g) / 4;
    ctx.beginPath();
    ctx.moveTo(p.x, gy);
    ctx.lineTo(p.x + p.w, gy);
    ctx.stroke();
  }
  ctx.restore();

  /* 하루 복습 수의 분포를 왼쪽에서 뻗는 막대로 */
  if (STATS.ready && STATS.counts.length) {
    var buckets = 24;
    var hist = new Array(buckets).fill(0);
    for (var i = 0; i < STATS.counts.length; i++) {
      var n = STATS.counts[i];
      if (n <= 0) { continue; }
      hist[clamp(Math.floor((n / axisTop) * buckets), 0, buckets - 1)]++;
    }
    var tallest = Math.max.apply(null, hist) || 1;
    ctx.fillStyle = "rgba(255,255,255,0.16)";
    var bh = p.h / buckets;
    for (var k = 0; k < buckets; k++) {
      if (!hist[k]) { continue; }
      var bw = (hist[k] / tallest) * (p.w * 0.32);
      ctx.fillRect(p.x, p.y + p.h - (k + 1) * bh + 0.5, bw, bh - 1);
    }
  }

  /* 곡선: 세로축의 개수마다 가로축의 어느 색이 되는지 */
  var endY = p.y + p.h - (Math.min(max, axisTop) / axisTop) * p.h;

  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = 5;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  tracePath(ctx, p, max);
  ctx.stroke();

  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2.5;
  tracePath(ctx, p, max);
  ctx.stroke();

  /* 최대 개수 위쪽은 색이 더 진해지지 않습니다 */
  if (endY > p.y + 1) {
    ctx.strokeStyle = "rgba(255,255,255,0.45)";
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(p.x + p.w, endY);
    ctx.lineTo(p.x + p.w, p.y);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  /* 손잡이 두 개 */
  var mid = midHandle(p, max);
  knob(ctx, mid.x, mid.y, "#ffffff", 8);
  knob(ctx, p.x + p.w, endY, S.base, 10);

  /* 축 눈금 */
  ctx.font = "11px system-ui, sans-serif";
  ctx.fillStyle = "#8b909a";
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  if (STATS.ready) {
    for (var t = 0; t <= 2; t++) {
      var value = Math.round((axisTop * t) / 2);
      ctx.fillText(String(value), p.x - 8, p.y + p.h - (p.h * t) / 2);
    }
  } else {
    ctx.fillText("…", p.x - 8, p.y + p.h / 2);
  }

  ctx.textBaseline = "top";
  ctx.textAlign = "left";
  ctx.fillText(t("axis_light"), p.x, p.y + p.h + 9);
  ctx.textAlign = "right";
  ctx.fillText(t("axis_dark"), p.x + p.w, p.y + p.h + 9);
  ctx.textAlign = "center";
  ctx.fillText(t("axis_color"), p.x + p.w / 2, p.y + p.h + 9);

  /* 최대 개수 표시 */
  if (STATS.ready) {
    ctx.textAlign = "right";
    ctx.textBaseline = "bottom";
    ctx.font = "600 12px system-ui, sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.fillText(fmt("count_n", max), p.x + p.w - 14, endY - 12);
  }
}

function tracePath(ctx, p, max) {
  var steps = 80;
  var visible = Math.min(max, axisTop) / axisTop;
  ctx.beginPath();
  for (var i = 0; i <= steps; i++) {
    var intensity = i / steps;
    var x = p.x + p.w * intensity;
    var y = p.y + p.h - countRatioAt(intensity) * visible * p.h;
    if (i === 0) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
  }
}

/**
 * 가운데 손잡이. 세로 위치는 curveY 를 그대로 쓰지 않고 곡선에서 다시 구합니다.
 * gamma 를 0.15~6 으로 제한하기 때문에 아주 극단적인 곳으로 끌면 저장된 값과
 * 실제 곡선이 살짝 어긋나는데, 이렇게 하면 손잡이가 언제나 곡선 위에 있습니다.
 */
function midHandle(p, max) {
  var visible = Math.min(max, axisTop) / axisTop;
  var color = clamp(S.curveX, 4, 96) / 100;
  return {
    x: p.x + p.w * color,
    y: p.y + p.h - countRatioAt(color) * visible * p.h
  };
}

function describeCurve() {
  var g = gamma();
  if (g < 0.8) { return t("curve_fast"); }
  if (g > 1.25) { return t("curve_slow"); }
  return t("curve_linear");
}

/* ------------------------------------------------------------------ 그리기 */

function redraw() {
  document.documentElement.style.setProperty("--accent", S.base);
  el("cornerOut").textContent = S.corner + "%";
  el("gapOut").textContent = S.gap + "%";
  el("alphaOut").textContent = Math.round((S.alpha / 255) * 100) + "%";

  el("curveNote").innerHTML = describeCurve();
  el("straight").disabled = S.curveX === S.curveY;
  el("autoMax").disabled = S.maxCount === 0;

  if (STATS.ready) {
    el("peakHint").textContent = STATS.peak > 0
      ? fmt("peak_n", STATS.peak)
      : t("no_history");
  } else {
    el("peakHint").textContent = t("loading");
  }

  var chosen = null;
  TARGETS.forEach(function (target) {
    if (target.key === active) { chosen = target; }
  });
  el("targetHint").textContent = chosen ? t(chosen.hint) : "";

  var tabs = el("targets").children;
  for (var i = 0; i < tabs.length; i++) {
    var key = tabs[i].dataset.key;
    tabs[i].setAttribute("aria-pressed", key === active ? "true" : "false");
    tabs[i].firstChild.style.background = S[key];
  }

  if (document.activeElement !== el("hex")) {
    el("hex").value = S[active];
  }

  drawSV();
  drawHue();
  drawPreview();
  drawCurve();
}

function syncInputs() {
  el("corner").value = S.corner;
  el("gap").value = S.gap;
  el("alpha").value = S.alpha;
}

function selectTarget(key) {
  active = key;
  HSV = rgbToHsv(parseHex(S[key]));
  redraw();
}

/* --------------------------------------------------------------- 문자열 */

/* 화면에 나오는 모든 문구는 Kotlin이 안드로이드 문자열 리소스에서 읽어
   넘겨줍니다. 따라서 AnkiDroid의 언어 설정을 그대로 따라갑니다.
   여기 적힌 값은 문자열을 못 받았을 때만 쓰이는 영어 대체값입니다. */
var STRINGS = {
  title: "Heatmap widget",
  subtitle: "Pick one colour. Days you studied more show up darker.",
  section_color: "Colour",
  hex_label: "Hex colour code",
  hex_hint: "You can type it in",
  wallpaper_colors: "From your wallpaper",
  basic_colors: "Basic colours",
  section_curve: "Intensity curve",
  section_shape: "Cell shape",
  straight: "Straight",
  auto_max: "Auto maximum",
  corner: "Corner",
  gap: "Spacing",
  opacity: "Opacity",
  cancel: "Cancel",
  save: "Save",
  target_base: "Base",
  target_empty: "Empty day",
  target_background: "Background",
  target_base_hint: "Colour of your busiest day",
  target_empty_hint: "Colour of a day with no reviews",
  target_background_hint: "Widget background tint",
  axis_light: "Light",
  axis_dark: "Dark",
  axis_color: "Colour",
  count_n: "%d",
  peak_n: "Peak %d/day",
  no_history: "No review history yet",
  loading: "Loading study history\u2026",
  curve_fast: "Gets dark <b>quickly</b>, even on light days.",
  curve_slow: "Only your <b>heaviest</b> days stand out.",
  curve_linear: "Darkens <b>in proportion</b> to reviews."
};

function t(key) { return STRINGS[key] !== undefined ? STRINGS[key] : key; }
function fmt(key, value) { return t(key).replace("%d", value); }

function applyStrings() {
  var nodes = document.querySelectorAll("[data-i18n]");
  for (var i = 0; i < nodes.length; i++) {
    nodes[i].textContent = t(nodes[i].getAttribute("data-i18n"));
  }
  var aria = document.querySelectorAll("[data-i18n-aria]");
  for (var j = 0; j < aria.length; j++) {
    aria[j].setAttribute("aria-label", t(aria[j].getAttribute("data-i18n-aria")));
  }
}

/* ------------------------------------------------------------------ 테마 */

/* 현재 AnkiDroid 테마의 색을 그대로 씁니다. 밝은 테마를 쓰면 이 화면도 밝습니다. */
function applyTheme(theme) {
  if (!theme) { return; }
  var root = document.documentElement.style;
  var map = {
    bg: "--bg", surface: "--surface", surface2: "--surface-2", line: "--line",
    text: "--text", muted: "--muted", accent: "--accent", onAccent: "--on-accent",
    stage1: "--stage-1", stage2: "--stage-2", stage3: "--stage-3"
  };
  for (var k in map) {
    if (theme[k]) { root.setProperty(map[k], theme[k]); }
  }
  document.documentElement.style.colorScheme = theme.dark ? "dark" : "light";
}

/* ------------------------------------------------------------------ 입력 */

(function buildTargets() {
  var host = el("targets");
  TARGETS.forEach(function (target) {
    var button = document.createElement("button");
    button.dataset.key = target.key;
    var dot = document.createElement("span");
    dot.className = "dot";
    button.appendChild(dot);
    button.appendChild(document.createTextNode(t(target.label)));
    button.addEventListener("click", function () { selectTarget(target.key); });
    host.appendChild(button);
  });
})();

function fillSwatches(host, colors) {
  host.innerHTML = "";
  colors.forEach(function (color) {
    var button = document.createElement("button");
    button.style.background = color;
    button.setAttribute("aria-label", color);
    button.addEventListener("click", function () {
      S[active] = color;
      HSV = rgbToHsv(parseHex(color));
      redraw();
    });
    host.appendChild(button);
  });
}

fillSwatches(el("presets"), PRESETS);

el("hex").addEventListener("input", function () {
  var text = this.value.trim().toUpperCase();
  if (text.charAt(0) !== "#") { text = "#" + text; }
  if (/^#[0-9A-F]{6}$/.test(text)) {
    S[active] = text;
    HSV = rgbToHsv(parseHex(text));
    redraw();
  }
});

el("hex").addEventListener("blur", function () { this.value = S[active]; });

function bindRange(id, field) {
  el(id).addEventListener("input", function () {
    S[field] = parseInt(this.value, 10);
    redraw();
  });
}

bindRange("corner", "corner");
bindRange("gap", "gap");
bindRange("alpha", "alpha");

el("straight").addEventListener("click", function () {
  S.curveX = 50;
  S.curveY = 50;
  redraw();
});

el("autoMax").addEventListener("click", function () {
  S.maxCount = 0;
  redraw();
});

/** 캔버스에 끌기 동작을 붙입니다. handler(x, y, view) 는 CSS 픽셀 좌표를 받습니다. */
function draggable(canvas, handler) {
  var dragging = false;

  function send(event) {
    var box = canvas.getBoundingClientRect();
    handler(event.clientX - box.left, event.clientY - box.top, { w: box.width, h: box.height });
  }

  canvas.addEventListener("pointerdown", function (event) {
    dragging = true;
    if (canvas.setPointerCapture) { canvas.setPointerCapture(event.pointerId); }
    send(event);
    event.preventDefault();
  });
  canvas.addEventListener("pointermove", function (event) {
    if (dragging) { send(event); }
  });
  function stop() { dragging = false; }
  canvas.addEventListener("pointerup", stop);
  canvas.addEventListener("pointercancel", stop);
}

draggable(el("sv"), function (x, y, view) {
  HSV.s = clamp(x / view.w, 0, 1);
  HSV.v = clamp(1 - y / view.h, 0, 1);
  commitHsv();
});

draggable(el("hue"), function (x, y, view) {
  HSV.h = clamp((x / view.w) * 360, 0, 359.9);
  commitHsv();
});

/* 오른쪽 끝 손잡이 = 최대 개수, 가운데 손잡이 = 곡선 모양 */
(function curveDragging() {
  var grabbed = null;

  draggable(el("curve"), function (x, y, view) {
    var p = plotRect(view);
    var max = effectiveMax();

    if (grabbed === null) {
      var mid = midHandle(p, max);
      var endY = p.y + p.h - (Math.min(max, axisTop) / axisTop) * p.h;
      var toMid = Math.pow(x - mid.x, 2) + Math.pow(y - mid.y, 2);
      var toEnd = Math.pow(x - (p.x + p.w), 2) + Math.pow(y - endY, 2);
      grabbed = toEnd < toMid ? "max" : "mid";
    }

    if (grabbed === "max") {
      var ratio = clamp((p.y + p.h - y) / p.h, 0.02, 1);
      var step = countStep();
      S.maxCount = Math.max(step, Math.round((ratio * axisTop) / step) * step);
    } else {
      var visible = Math.min(max, axisTop) / axisTop;
      S.curveX = clamp(Math.round(((x - p.x) / p.w) * 100), 4, 96);
      S.curveY = clamp(
        Math.round((((p.y + p.h - y) / p.h) / Math.max(visible, 0.02)) * 100),
        4,
        96
      );
    }
    redraw();
  });

  function release() { grabbed = null; }
  el("curve").addEventListener("pointerup", release);
  el("curve").addEventListener("pointercancel", release);
})();

el("save").addEventListener("click", function () {
  if (!window.AnkiHeatmap) { return; }
  AnkiHeatmap.save(JSON.stringify({
    base: S.base,
    empty: S.empty,
    background: S.background,
    alpha: S.alpha,
    corner: S.corner,
    gap: S.gap,
    curveX: S.curveX,
    curveY: S.curveY,
    maxCount: S.maxCount
  }));
});

el("cancel").addEventListener("click", function () {
  if (window.AnkiHeatmap && AnkiHeatmap.cancel) { AnkiHeatmap.cancel(); }
});

/* 학습 기록은 컬렉션을 열어야 하므로 준비되는 대로 여기로 들어옵니다. */
window.ankiHeatmapStats = function (stats) {
  STATS = {
    counts: stats.counts || [],
    auto: stats.auto || 40,
    peak: stats.peak || 0,
    weekday: stats.weekday || 0,
    ready: true
  };
  recomputeAxisTop();
  redraw();
};

window.addEventListener("resize", redraw);

(function start() {
  var loaded = DEFAULTS;
  try {
    if (window.AnkiHeatmap) {
      var raw = AnkiHeatmap.load();
      if (raw) { loaded = JSON.parse(raw); }
    }
  } catch (e) { /* 기본값으로 진행합니다. */ }

  if (loaded.strings) { STRINGS = Object.assign({}, STRINGS, loaded.strings); }
  applyStrings();
  applyTheme(loaded.theme);

  S = Object.assign({}, DEFAULTS, loaded);

  if (Array.isArray(loaded.themeColors) && loaded.themeColors.length) {
    THEME_COLORS = loaded.themeColors;
    fillSwatches(el("themeColors"), THEME_COLORS);
    el("themeRow").hidden = false;
  }

  syncInputs();
  recomputeAxisTop();
  selectTarget("base");

  if (window.AnkiHeatmap && AnkiHeatmap.requestStats) {
    AnkiHeatmap.requestStats();
  }
})();
</script>
</body>
</html>
