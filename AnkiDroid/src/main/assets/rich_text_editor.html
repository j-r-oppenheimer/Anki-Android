<!DOCTYPE html>

<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #202020;
        --label: #808080;
        --border: #d0d0d0;
        --accent: #3f51b5;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-size: 16px;
        font-family: sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .block { padding: 6px 8px 10px 8px; }
      .label {
        font-size: 12px;
        font-weight: bold;
        color: var(--label);
        padding-bottom: 4px;
      }
      .editor {
        min-height: 2.4em;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        outline: none;
        line-height: 1.5;
        word-wrap: break-word;
        overflow-wrap: anywhere;
      }
      .editor:focus { border-color: var(--accent); }
      .editor img { max-width: 100%; height: auto; }
      .editor ul, .editor ol { margin: 0.3em 0; padding-inline-start: 1.6em; }
    </style>
  </head>
  <body>
    <div id="fields"></div>
    <script>
      // The note editor owns the field values; this page is only a view over them.
      // Every keystroke is pushed straight back so a save never races the editor.
      var active = null;

      function post(name, arg) {
        if (window.AnkiRich && window.AnkiRich[name]) window.AnkiRich[name](arg);
      }

      function reportHeight() {
        post('onHeight', Math.ceil(document.body.scrollHeight));
      }

      function reportState() {
        if (!active) return;
        var state = [];
        ['bold', 'italic', 'underline', 'insertUnorderedList', 'insertOrderedList'].forEach(function (c) {
          try { if (document.queryCommandState(c)) state.push(c); } catch (e) { /* unsupported */ }
        });
        if (inlineStyleAt('backgroundColor')) state.push('highlight');
        if (inlineStyleAt('color')) state.push('textColor');
        post('onFormatState', state.join(','));
      }

      function reportCaret() {
        var sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return;
        var rect = sel.getRangeAt(0).getBoundingClientRect();
        // A collapsed range at the start of an empty line has a zero rect; fall
        // back to the field itself so the caret still gets scrolled into view.
        var top = rect.height ? rect.top : (active ? active.getBoundingClientRect().top : 0);
        post('onCaret', Math.round(top + window.scrollY));
      }

      function setFields(fields) {
        var root = document.getElementById('fields');
        root.textContent = '';
        fields.forEach(function (field, index) {
          var block = document.createElement('div');
          block.className = 'block';

          var label = document.createElement('div');
          label.className = 'label';
          label.textContent = field.name;
          block.appendChild(label);

          var editor = document.createElement('div');
          editor.className = 'editor';
          editor.contentEditable = 'true';
          editor.dataset.index = index;
          editor.innerHTML = field.html;
          block.appendChild(editor);

          root.appendChild(block);
        });
        active = root.querySelector('.editor');
        reportHeight();
      }

      function setTheme(bg, fg, label, border, accent) {
        var s = document.documentElement.style;
        s.setProperty('--bg', bg);
        s.setProperty('--fg', fg);
        s.setProperty('--label', label);
        s.setProperty('--border', border);
        s.setProperty('--accent', accent);
      }

      function focusField(index) {
        var editor = document.querySelector('.editor[data-index="' + index + '"]');
        if (!editor) return;
        editor.focus();
        var range = document.createRange();
        range.selectNodeContents(editor);
        range.collapse(false);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }

      function exec(command, value) {
        if (!active) return;
        active.focus();
        // Bold and friends should stay as <b>/<i>/<u> tags, which is what Anki's
        // own editor writes. Only the highlighter needs an inline style.
        var css = command === 'hiliteColor' || command === 'foreColor';
        try { document.execCommand('styleWithCSS', false, css); } catch (e) { /* unsupported */ }
        var applied = document.execCommand(command, false, value || null);
        // Some WebView builds only know the older name for the highlighter.
        if (!applied && command === 'hiliteColor') document.execCommand('backColor', false, value);
        flush(active);
        reportState();
      }

      // A colour the user would never pick. execCommand does the hard part of
      // splitting the selection out of its surrounding span; painting with the
      // sentinel and then stripping it is what actually removes a colour, since
      // execCommand has no way to unset one.
      var SENTINEL = '#010203';
      var SENTINEL_RGB = 'rgb(1, 2, 3)';
      var NO_COLOUR = ['', 'transparent', 'rgba(0, 0, 0, 0)'];

      /** The inline colour on or above the selection, or null when there is none. */
      function inlineStyleAt(prop) {
        var sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return null;
        var node = sel.getRangeAt(0).startContainer;
        if (node.nodeType === 3) node = node.parentNode;
        while (node && node.nodeType === 1 && !node.classList.contains('editor')) {
          var value = node.style && node.style[prop];
          if (value && NO_COLOUR.indexOf(value) === -1) return value;
          if (prop === 'color' && node.tagName === 'FONT' && node.getAttribute('color')) {
            return node.getAttribute('color');
          }
          node = node.parentNode;
        }
        return null;
      }

      function strip(root, prop, cssProp, sentinels) {
        var spans = root.querySelectorAll('span[style]');
        for (var i = spans.length - 1; i >= 0; i--) {
          var span = spans[i];
          if (sentinels.indexOf(span.style[prop]) === -1) continue;
          span.style.removeProperty(cssProp);
          if (span.getAttribute('style')) continue;
          var parent = span.parentNode;
          while (span.firstChild) parent.insertBefore(span.firstChild, span);
          parent.removeChild(span);
          parent.normalize();
        }
      }

      // The toolbar button toggles: colouring a run that already has a colour takes
      // it off. Picking a colour from the popup always paints, so that choosing a
      // different one recolours the run instead of clearing it.
      function paint(command, prop, cssProp, offValue, sentinels, color, toggle) {
        if (toggle && inlineStyleAt(prop)) {
          exec(command, offValue);
          if (active) strip(active, prop, cssProp, sentinels);
          flush(active);
        } else {
          exec(command, color);
        }
        reportState();
      }

      function highlight(color, toggle) {
        paint('hiliteColor', 'backgroundColor', 'background-color', 'transparent',
              ['transparent', 'rgba(0, 0, 0, 0)'], color, toggle);
      }

      function textColor(color, toggle) {
        paint('foreColor', 'color', 'color', SENTINEL, [SENTINEL, SENTINEL_RGB], color, toggle);
      }

      // ----------------------------------------------------------------- lists

      /** The list the selection sits in: its tag and how deep it is nested. */
      function listInfo() {
        var sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return null;
        var node = sel.getRangeAt(0).startContainer;
        if (node.nodeType === 3) node = node.parentNode;
        var tag = null;
        var depth = 0;
        while (node && node.nodeType === 1 && !node.classList.contains('editor')) {
          if (node.tagName === 'UL' || node.tagName === 'OL') {
            if (!tag) tag = node.tagName;
            depth++;
          }
          node = node.parentNode;
        }
        return tag ? { tag: tag, depth: depth } : null;
      }

      // Pressing the button walks back out one level at a time, and the last press
      // drops the list altogether. A different list type converts straight over.
      function listAction(command, tag) {
        var info = listInfo();
        if (info && info.tag === tag && info.depth > 1) {
          exec('outdent');
        } else {
          exec(command);
        }
      }

      function listCommandFor(tag) {
        return tag === 'OL' ? 'insertOrderedList' : 'insertUnorderedList';
      }

      /** True when the caret sits at the very start of its list item. */
      function atItemStart() {
        var sel = window.getSelection();
        if (!sel || sel.rangeCount === 0 || !sel.isCollapsed) return false;
        var range = sel.getRangeAt(0);
        var item = range.startContainer;
        if (item.nodeType === 3) item = item.parentNode;
        while (item && item.tagName !== 'LI' && !item.classList.contains('editor')) item = item.parentNode;
        if (!item || item.tagName !== 'LI') return false;
        var before = range.cloneRange();
        before.selectNodeContents(item);
        before.setEnd(range.startContainer, range.startOffset);
        return before.toString().length === 0;
      }

      document.addEventListener('keydown', function (e) {
        if (!e.target.classList || !e.target.classList.contains('editor')) return;
        var info = listInfo();
        if (e.key === 'Tab' && info) {
          e.preventDefault();
          exec(e.shiftKey ? 'outdent' : 'indent');
          return;
        }
        // Backspace against the front of an item steps out of the list rather than
        // pulling the item's text up into the one above it.
        if (e.key === 'Backspace' && info && atItemStart()) {
          e.preventDefault();
          if (info.depth > 1) exec('outdent');
          else exec(listCommandFor(info.tag));
        }
      });

      // A contenteditable block is never truly empty: the browser parks a <br> in
      // it to give the caret somewhere to sit, and one sits after the last line of
      // any block. Neither is content, and leaving them in means a field that looks
      // empty here shows up as "<br>" in the HTML editor.
      function normalise(html) {
        var out = html.replace(/<br\s*\/?>\s*$/i, '');
        return out.trim() === '' ? '' : out;
      }

      function flush(editor) {
        post('onFieldChanged', editor.dataset.index + ':' + normalise(editor.innerHTML));
      }

      function flushAll() {
        document.querySelectorAll('.editor').forEach(flush);
      }

      document.addEventListener('input', function (e) {
        if (!e.target.classList.contains('editor')) return;
        flush(e.target);
        reportHeight();
        reportCaret();
      });

      document.addEventListener('focusin', function (e) {
        if (!e.target.classList.contains('editor')) return;
        active = e.target;
        reportState();
        reportCaret();
      });

      document.addEventListener('selectionchange', function () {
        reportState();
      });

      // Pasting rich content from another app drags along fonts and colours that
      // do not belong in a note; keep the text and let the toolbar do formatting.
      document.addEventListener('paste', function (e) {
        if (!e.target.classList || !e.target.classList.contains('editor')) return;
        var text = e.clipboardData && e.clipboardData.getData('text/plain');
        if (text === null || text === undefined) return;
        e.preventDefault();
        document.execCommand('insertText', false, text);
      });

      // A long press fires contextmenu too, so remember what the last press came
      // from. On a phone the selection already has the system's own menu and the
      // toolbar is a thumb away at the bottom; a floating copy would only be the
      // same buttons twice on a small screen.
      var lastPointerType = '';
      document.addEventListener('pointerdown', function (e) {
        lastPointerType = e.pointerType || '';
      }, true);

      // A right click on a selection asks for the toolbar where the text is,
      // rather than the browser's own menu.
      document.addEventListener('contextmenu', function (e) {
        if (!e.target.classList || !e.target.classList.contains('editor')) return;
        if (lastPointerType !== 'mouse' && e.button !== 2) return;
        var sel = window.getSelection();
        if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
        e.preventDefault();
        var rect = sel.getRangeAt(0).getBoundingClientRect();
        post('onContextMenu',
             Math.round(rect.left + window.scrollX) + ':' + Math.round(rect.top + window.scrollY));
      });

      window.addEventListener('resize', reportHeight);
      new ResizeObserver(reportHeight).observe(document.body);
    </script>
  </body>
</html>
