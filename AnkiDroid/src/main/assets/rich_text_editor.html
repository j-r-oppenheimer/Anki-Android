<!DOCTYPE html>

<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #202020;
        --label: #808080;
        --border: #d0d0d0;
        --accent: #3f51b5;
        --field-font-size: 16px;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-size: 16px;
        font-family: sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .block { padding: 6px 8px 10px 8px; }
      /* The HTML editor leaves 16dp below its fields, before the tags and cards. */
      .block:last-child { padding-bottom: 16px; }
      .label {
        font-size: 12px;
        font-weight: bold;
        color: var(--label);
        padding-bottom: 4px;
      }
      .editor {
        font-size: var(--field-font-size);
        /* One line, as an empty field in the HTML editor is. */
        min-height: 1.5em;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        outline: none;
        line-height: 1.5;
        word-wrap: break-word;
        overflow-wrap: anywhere;
      }
      .editor:focus { border-color: var(--accent); }
      .editor img { max-width: 100%; height: auto; }
      .editor ul, .editor ol { margin: 0.3em 0; padding-inline-start: 1.6em; }
    </style>
  </head>
  <body>
    <div id="fields"></div>
    <script>
      // The note editor owns the field values; this page is only a view over them.
      // Every keystroke is pushed straight back so a save never races the editor.
      var active = null;

      // The app finds a method by its name and its number of arguments, so one
      // that takes none has to be called with none, not with an undefined.
      function post(name, arg) {
        if (!window.AnkiRich || !window.AnkiRich[name]) return;
        if (arguments.length < 2) window.AnkiRich[name]();
        else window.AnkiRich[name](arg);
      }

      function reportHeight() {
        post('onHeight', Math.ceil(document.body.scrollHeight));
      }

      function reportState() {
        if (!active) return;
        var state = [];
        ['bold', 'italic', 'underline', 'insertUnorderedList', 'insertOrderedList'].forEach(function (c) {
          try { if (document.queryCommandState(c)) state.push(c); } catch (e) { /* unsupported */ }
        });
        if (inlineStyleAt('backgroundColor')) state.push('highlight');
        if (inlineStyleAt('color')) state.push('textColor');
        post('onFormatState', state.join(','));
      }

      function reportCaret() {
        var sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return;
        post('onCaret', Math.round(caretTop(sel.getRangeAt(0)) + window.scrollY));
      }

      /**
       * Where the caret's line starts. A caret on an empty line has no rect of its
       * own, so the line it sits in stands in for it; the whole field would send a
       * long field back to its first line.
       */
      function caretTop(range) {
        var rect = range.getBoundingClientRect();
        if (rect.height) return rect.top;
        var node = range.startContainer;
        if (node.nodeType === 3) node = node.parentNode;
        var child = node.childNodes[range.startOffset];
        var line = child && child.nodeType === 1 ? child : node;
        return line.getBoundingClientRect().top;
      }

      function setFields(fields) {
        var root = document.getElementById('fields');
        root.textContent = '';
        fields.forEach(function (field, index) {
          var block = document.createElement('div');
          block.className = 'block';

          var label = document.createElement('div');
          label.className = 'label';
          label.textContent = field.name;
          block.appendChild(label);

          var editor = document.createElement('div');
          editor.className = 'editor';
          editor.contentEditable = 'true';
          editor.dataset.index = index;
          editor.innerHTML = field.html;
          block.appendChild(editor);

          root.appendChild(block);
        });
        active = root.querySelector('.editor');
        reportHeight();
        post('onFieldsShown');
      }

      function setTheme(bg, fg, label, border, accent) {
        var s = document.documentElement.style;
        s.setProperty('--bg', bg);
        s.setProperty('--fg', fg);
        s.setProperty('--label', label);
        s.setProperty('--border', border);
        s.setProperty('--accent', accent);
      }

      /** Takes the size in screen pixels, and draws it at that size on screen. */
      function setFontSize(screenPx) {
        var css = screenPx / (window.devicePixelRatio || 1);
        document.documentElement.style.setProperty('--field-font-size', css + 'px');
      }

      function focusField(index) {
        var editor = document.querySelector('.editor[data-index="' + index + '"]');
        if (!editor) return;
        editor.focus();
        var range = document.createRange();
        range.selectNodeContents(editor);
        range.collapse(false);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }

      function exec(command, value) {
        if (!active) return;
        active.focus();
        // Bold and friends should stay as <b>/<i>/<u> tags, which is what Anki's
        // own editor writes. Only the highlighter needs an inline style.
        var css = command === 'hiliteColor' || command === 'foreColor';
        try { document.execCommand('styleWithCSS', false, css); } catch (e) { /* unsupported */ }
        var applied = document.execCommand(command, false, value || null);
        // Some WebView builds only know the older name for the highlighter.
        if (!applied && command === 'hiliteColor') document.execCommand('backColor', false, value);
        flush(active);
        reportState();
      }

      // A colour the user would never pick. execCommand does the hard part of
      // splitting the selection out of its surrounding span; painting with the
      // sentinel and then stripping it is what actually removes a colour, since
      // execCommand has no way to unset one.
      var SENTINEL = '#010203';
      var SENTINEL_RGB = 'rgb(1, 2, 3)';
      var NO_COLOUR = ['', 'transparent', 'rgba(0, 0, 0, 0)'];

      /** The inline colour on or above the selection, or null when there is none. */
      function inlineStyleAt(prop) {
        var sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return null;
        var node = sel.getRangeAt(0).startContainer;
        if (node.nodeType === 3) node = node.parentNode;
        while (node && node.nodeType === 1 && !node.classList.contains('editor')) {
          var value = node.style && node.style[prop];
          if (value && NO_COLOUR.indexOf(value) === -1) return value;
          if (prop === 'color' && node.tagName === 'FONT' && node.getAttribute('color')) {
            return node.getAttribute('color');
          }
          node = node.parentNode;
        }
        return null;
      }

      function strip(root, prop, cssProp, sentinels) {
        var spans = root.querySelectorAll('span[style]');
        for (var i = spans.length - 1; i >= 0; i--) {
          var span = spans[i];
          if (sentinels.indexOf(span.style[prop]) === -1) continue;
          span.style.removeProperty(cssProp);
          if (span.getAttribute('style')) continue;
          var parent = span.parentNode;
          while (span.firstChild) parent.insertBefore(span.firstChild, span);
          parent.removeChild(span);
          parent.normalize();
        }
      }

      // The toolbar button toggles: colouring a run that already has a colour takes
      // it off. Picking a colour from the popup always paints, so that choosing a
      // different one recolours the run instead of clearing it.
      function paint(command, prop, cssProp, offValue, sentinels, color, toggle) {
        if (toggle && inlineStyleAt(prop)) {
          exec(command, offValue);
          if (active) strip(active, prop, cssProp, sentinels);
          flush(active);
        } else {
          exec(command, color);
        }
        reportState();
      }

      function highlight(color, toggle) {
        paint('hiliteColor', 'backgroundColor', 'background-color', 'transparent',
              ['transparent', 'rgba(0, 0, 0, 0)'], color, toggle);
      }

      function textColor(color, toggle) {
        paint('foreColor', 'color', 'color', SENTINEL, [SENTINEL, SENTINEL_RGB], color, toggle);
      }

      // ----------------------------------------------------------------- lists

      /** The list the selection sits in: its tag and how deep it is nested. */
      function listInfo() {
        var sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return null;
        var node = sel.getRangeAt(0).startContainer;
        if (node.nodeType === 3) node = node.parentNode;
        var tag = null;
        var depth = 0;
        while (node && node.nodeType === 1 && !node.classList.contains('editor')) {
          if (node.tagName === 'UL' || node.tagName === 'OL') {
            if (!tag) tag = node.tagName;
            depth++;
          }
          node = node.parentNode;
        }
        return tag ? { tag: tag, depth: depth } : null;
      }

      // Pressing the button walks back out one level at a time, and the last press
      // drops the list altogether. A different list type converts straight over.
      function listAction(command, tag) {
        var info = listInfo();
        if (info && info.tag === tag && info.depth > 1) {
          exec('outdent');
        } else {
          exec(command);
        }
      }

      function listCommandFor(tag) {
        return tag === 'OL' ? 'insertOrderedList' : 'insertUnorderedList';
      }

      /** True when the caret sits at the very start of its list item. */
      function atItemStart() {
        var sel = window.getSelection();
        if (!sel || sel.rangeCount === 0 || !sel.isCollapsed) return false;
        var range = sel.getRangeAt(0);
        var item = range.startContainer;
        if (item.nodeType === 3) item = item.parentNode;
        while (item && item.tagName !== 'LI' && !item.classList.contains('editor')) item = item.parentNode;
        if (!item || item.tagName !== 'LI') return false;
        var before = range.cloneRange();
        before.selectNodeContents(item);
        before.setEnd(range.startContainer, range.startOffset);
        return before.toString().length === 0;
      }

      document.addEventListener('keydown', function (e) {
        if (!e.target.classList || !e.target.classList.contains('editor')) return;
        var info = listInfo();
        if (e.key === 'Tab' && info) {
          e.preventDefault();
          exec(e.shiftKey ? 'outdent' : 'indent');
          return;
        }
        // Backspace against the front of an item steps out of the list rather than
        // pulling the item's text up into the one above it.
        if (e.key === 'Backspace' && info && atItemStart()) {
          e.preventDefault();
          if (info.depth > 1) exec('outdent');
          else exec(listCommandFor(info.tag));
        }
      });

      // A contenteditable block is never truly empty: the browser parks a <br> in
      // it to give the caret somewhere to sit, and one sits after the last line of
      // any block. Neither is content, and leaving them in means a field that looks
      // empty here shows up as "<br>" in the HTML editor.
      function normalise(html) {
        var out = html.replace(/<br\s*\/?>\s*$/i, '');
        return out.trim() === '' ? '' : out;
      }

      /**
       * Puts text either side of the selection, leaving what is inside it alone.
       * Cloze markers stay as the {{c1::...}} text Anki reads, because there is
       * nothing to show instead: the deletion is not a style, it is the answer.
       */
      function wrapSelection(prefix, suffix) {
        if (!active) return;
        active.focus();
        var sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return;
        var range = sel.getRangeAt(0);
        var collapsed = range.collapsed;

        // The closing text goes in first: adding the opening text first would
        // shift every offset after it, including the end of the selection.
        var tail = range.cloneRange();
        tail.collapse(false);
        var close = document.createTextNode(suffix);
        tail.insertNode(close);

        var head = range.cloneRange();
        head.collapse(true);
        var open = document.createTextNode(prefix);
        head.insertNode(open);

        var caret = document.createRange();
        if (collapsed) {
          caret.setStartAfter(open);
        } else {
          caret.setStartAfter(close);
        }
        caret.collapse(true);
        sel.removeAllRanges();
        sel.addRange(caret);

        flush(active);
        reportHeight();
        reportCaret();
      }

      /**
       * Puts html where something was dropped: at the place in the text nearest
       * (x, y), in the field there. With no text position to be found, it goes at
       * the end of that field.
       */
      function insertAt(x, y, html) {
        var target = document.elementFromPoint(x, y);
        var editor = (target && target.closest && target.closest('.editor')) || active;
        if (!editor) return;
        var range = document.caretRangeFromPoint(x, y);
        if (!range || !editor.contains(range.startContainer)) {
          range = document.createRange();
          range.selectNodeContents(editor);
          range.collapse(false);
        }
        editor.focus();
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        document.execCommand('insertHTML', false, html);
        flush(editor);
        reportHeight();
      }

      function flush(editor) {
        post('onFieldChanged', editor.dataset.index + ':' + normalise(editor.innerHTML));
      }

      function flushAll() {
        document.querySelectorAll('.editor').forEach(flush);
      }

      document.addEventListener('input', function (e) {
        if (!e.target.classList.contains('editor')) return;
        flush(e.target);
        reportHeight();
        reportCaret();
      });

      document.addEventListener('focusin', function (e) {
        if (!e.target.classList.contains('editor')) return;
        active = e.target;
        reportState();
        // Focus arrives before the tap has moved the caret. Reporting it now would
        // scroll to wherever the caret last was, so wait for the tap to finish.
        setTimeout(reportCaret, 0);
      });

      document.addEventListener('selectionchange', function () {
        reportState();
      });

      // ------------------------------------------------------------------ paste

      var PASTE_SKIP = { HEAD: 1, META: 1, TITLE: 1, STYLE: 1, SCRIPT: 1, IMG: 1 };
      var PASTE_BLOCKS = { DIV: 'div', P: 'div', LI: 'li', UL: 'ul', OL: 'ol' };

      /** A colour in the one form the browser reports it in, so two can be compared. */
      function canonicalColour(value) {
        var probe = document.createElement('span');
        probe.style.color = value;
        return probe.style.color;
      }

      /**
       * Rebuilds pasted HTML out of what the toolbar itself writes: bold, italic,
       * underline, highlight and text colour, line breaks and lists. Copying out of
       * a field puts the page's own font, size and colours on every run; those, and
       * whatever else another app brings, are left behind.
       */
      function cleanPastedHtml(html) {
        var pageFg = canonicalColour(getComputedStyle(document.body).color);
        var pageBg = canonicalColour(getComputedStyle(document.body).backgroundColor);
        var source = document.createElement('template');
        source.innerHTML = html;

        function keepColour(value, page) {
          if (!value) return null;
          var colour = canonicalColour(value);
          return colour && colour !== page && NO_COLOUR.indexOf(colour) === -1 ? colour : null;
        }

        function copyChildren(from, to) {
          for (var child = from.firstChild; child; child = child.nextSibling) {
            var cleaned = clean(child);
            if (cleaned) to.appendChild(cleaned);
          }
          return to;
        }

        function clean(node) {
          if (node.nodeType === 3) return document.createTextNode(node.nodeValue);
          if (node.nodeType !== 1 || PASTE_SKIP[node.tagName]) return null;
          if (node.tagName === 'BR') return document.createElement('br');

          var style = node.style;
          var weight = style.fontWeight;
          var bold = weight === 'bold' || weight === 'bolder' || parseInt(weight, 10) >= 600 ||
              (!weight && (node.tagName === 'B' || node.tagName === 'STRONG'));
          var italic = style.fontStyle === 'italic' ||
              (!style.fontStyle && (node.tagName === 'I' || node.tagName === 'EM'));
          var decoration = style.textDecorationLine || style.textDecoration || '';
          var underline = decoration.indexOf('underline') !== -1 || node.tagName === 'U';
          var background = keepColour(style.backgroundColor, pageBg);
          var colour = keepColour(style.color || (node.tagName === 'FONT' && node.getAttribute('color')), pageFg);

          var inner = copyChildren(node, document.createDocumentFragment());
          if (colour || background) {
            var span = document.createElement('span');
            if (background) span.style.backgroundColor = background;
            if (colour) span.style.color = colour;
            span.appendChild(inner);
            inner = span;
          }
          [[underline, 'u'], [italic, 'i'], [bold, 'b']].forEach(function (wrap) {
            if (!wrap[0]) return;
            var el = document.createElement(wrap[1]);
            el.appendChild(inner);
            inner = el;
          });
          var block = PASTE_BLOCKS[node.tagName];
          if (block) {
            var wrapper = document.createElement(block);
            wrapper.appendChild(inner);
            inner = wrapper;
          }
          return inner;
        }

        return copyChildren(source.content, document.createElement('div')).innerHTML;
      }

      // Keep the formatting a note can hold, so bold and highlights survive a copy
      // and paste between fields; the rest of a pasted page's styling is dropped.
      document.addEventListener('paste', function (e) {
        if (!e.target.closest || !e.target.closest('.editor')) return;
        var data = e.clipboardData;
        if (!data) return;
        var html = data.getData('text/html');
        var text = data.getData('text/plain');
        if (html) {
          e.preventDefault();
          document.execCommand('insertHTML', false, cleanPastedHtml(html));
        } else if (text) {
          e.preventDefault();
          document.execCommand('insertText', false, text);
        }
      });

      // A long press fires contextmenu too, so remember what the last press came
      // from. On a phone the selection already has the system's own menu and the
      // toolbar is a thumb away at the bottom; a floating copy would only be the
      // same buttons twice on a small screen.
      var lastPointerType = '';
      document.addEventListener('pointerdown', function (e) {
        lastPointerType = e.pointerType || '';
      }, true);

      // Pressing the right button inside a selection would otherwise put the caret
      // where it was clicked, throwing the selection away before the toolbar could
      // act on it. Refusing the default press keeps it.
      document.addEventListener('mousedown', function (e) {
        if (e.button !== 2) return;
        if (!e.target.closest || !e.target.closest('.editor')) return;
        e.preventDefault();
      }, true);

      // A right click asks for the toolbar where the click was, rather than the
      // browser's own menu.
      document.addEventListener('contextmenu', function (e) {
        // The click lands on whatever is under the pointer, which inside a
        // formatted run is a <b> or a highlight's <span>, not the field itself.
        var field = e.target.closest && e.target.closest('.editor');
        if (!field) return;
        if (lastPointerType !== 'mouse' && e.button !== 2) return;
        var sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return;
        e.preventDefault();
        // Centred over the pointer, not the selection: a long selection starts
        // well away from where the mouse is.
        post('onContextMenu',
             Math.round(e.clientX + window.scrollX) + ':' + Math.round(e.clientY + window.scrollY));
      });

      window.addEventListener('resize', reportHeight);
      new ResizeObserver(reportHeight).observe(document.body);
    </script>
  </body>
</html>
